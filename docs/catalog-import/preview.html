<head>
  <meta charset="UTF-8" />

  <title>Тестовый каталог — валидация импорта</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ec;
      --card: #fff;
      --text: #1f2933;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2f6b5d;
      --chip: #eef5f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    header h1 { margin: 0 0 8px; font-size: 24px; }
    header p { margin: 0; color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }
    input[type="search"] {
      flex: 1 1 240px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font: inherit;
    }
    .chip.is-active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #fafafa;
      border-bottom: 1px solid var(--line);
    }
    .card-body { padding: 16px 18px 18px; display: grid; gap: 12px; }
    .card h2 { margin: 0; font-size: 20px; }
    .meta { color: var(--muted); font-size: 13px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: var(--chip);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-top: 1px solid var(--line);
      padding: 6px 0;
      vertical-align: top;
      text-align: left;
    }
    th { width: 38%; color: var(--muted); font-weight: 600; }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .layers, .notes {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
    }
    .modal-box {
      background: #f8faf9;
      border: 1px dashed #c7d7d1;
      border-radius: 12px;
      padding: 12px;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }
    code { font-size: 12px; }
  </style>
</head>

","sizes":["140x190","140x200","160x190","160x200","180x190","180x200"],"filling_slugs":["latex"],"features":[],"image":"images/deluxe-latex.png","image_alt":"Делюкс Латекс — коллекция Топеры","sort_order":51,"tags":["Топер","Средний"],"cover":"Трикотаж с объёмной стежкой на холконе","layers":["neolatex (40мм)"],"mapping_notes":["Нагрузка в каталоге не указана; использовано `max_load_kg: 120` → `upTo120`"],"collection_label":"Топеры","modal_preview":[["Жесткость","Средний"],["Тип матраса","Топер"],["Высота","6 см (Компактные до 16 см)"],["Нагрузка","до 120 кг"],["Размер","140 × 190, 140 × 200, 160 × 190, 160 × 200, 180 × 190, 180 × 200"],["Наполнители (slug)","Латекс"],["Особенности","—"]],"layers_modal_text":"1. neolatex (40мм)"},{"name":"Софт","slug":"soft-topper","collection":"topper","source_pdf":"pdf/52.pdf","height_cm":6,"max_load_kg":120,"firmness_side1":null,"firmness_side2":null,"firmness":"medium","mattress_type":"topper","load_range":"upTo120","height_range":"low","sizes":["140x190","140x200","160x190","160x200","180x190","180x200"],"filling_slugs":["memoryEffect"],"features":[],"image":"images/soft-topper.png","image_alt":"Софт — коллекция Топеры","sort_order":52,"tags":["Топер","Средний"],"cover":"Трикотаж с объёмной стежкой на холконе","layers":["пена с эффектом памяти \"memory foam\" (40мм)"],"mapping_notes":["Нагрузка в каталоге не указана; использовано `max_load_kg: 120` → `upTo120`"],"collection_label":"Топеры","modal_preview":[["Жесткость","Средний"],["Тип матраса","Топер"],["Высота","6 см (Компактные до 16 см)"],["Нагрузка","до 120 кг"],["Размер","140 × 190, 140 × 200, 160 × 190, 160 × 200, 180 × 190, 180 × 200"],["Наполнители (slug)","С эффектом памяти"],["Особенности","—"]],"layers_modal_text":"1. пена с эффектом памяти \"memory foam\" (40мм)"},{"name":"Сенсетив","slug":"sensitive","collection":"topper","source_pdf":"pdf/53.pdf","height_cm":6,"max_load_kg":120,"firmness_side1":null,"firmness_side2":null,"firmness":"medium","mattress_type":"topper","load_range":"upTo120","height_range":"low","sizes":["140x190","140x200","160x190","160x200","180x190","180x200"],"filling_slugs":[],"features":[],"image":"images/sensitive.png","image_alt":"Сенсетив — коллекция Топеры","sort_order":53,"tags":["Топер","Средний"],"cover":"Трикотаж с объёмной стежкой на холконе","layers":[],"mapping_notes":["Нагрузка в каталоге не указана; использовано `max_load_kg: 120` → `upTo120`"],"collection_label":"Топеры","modal_preview":[["Жесткость","Средний"],["Тип матраса","Топер"],["Высота","6 см (Компактные до 16 см)"],["Нагрузка","до 120 кг"],["Размер","140 × 190, 140 × 200, 160 × 190, 160 × 200, 180 × 190, 180 × 200"],["Наполнители (slug)",""],["Особенности","—"]],"layers_modal_text":""}];
    const COLLECTIONS = ['all', ...Array.from(new Set(PRODUCTS.map((p) => p.collection))).sort()];

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');
    const chipsRoot = document.getElementById('collection-chips');

    let activeCollection = 'all';

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function renderTable(rows) {
      return '<table><tbody>' + rows.map(([label, value]) =>
        '<tr><th>' + escapeHtml(label) + '</th><td>' + escapeHtml(value) + '</td></tr>'
      ).join('') + '</tbody></table>';
    }

    function renderCard(product) {
      const layers = (product.layers || []).map((line, index) => '<li>' + escapeHtml((index + 1) + '. ' + line) + '</li>').join('');
      const notes = (product.mapping_notes || []).map((line) => '<li>' + escapeHtml(line) + '</li>').join('');
      const tags = (product.tags || []).map((tag) => '<span class="tag">' + escapeHtml(tag) + '</span>').join('');
      const imagePath = String(product.image || '').replace(/^images\//, 'images/');

      return '<article class="card" data-collection="' + escapeHtml(product.collection) + '">' +
        '<img src="' + escapeHtml(imagePath) + '" alt="' + escapeHtml(product.image_alt || product.name) + '" width="1034" height="1034" loading="lazy" />' +
        '<div class="card-body">' +
          '<div><h2>' + escapeHtml(product.name) + '</h2>' +
          '<div class="meta"><code>' + escapeHtml(product.slug) + '</code> · ' + escapeHtml(product.collection_label) + ' · ' + escapeHtml(product.source_pdf) + '</div></div>' +
          '<div class="tags">' + tags + '</div>' +
          '<div><p class="section-title">Параметры (Strapi / фильтры)</p>' + renderTable([
            ['Коллекция', product.collection + ' → ' + product.collection_label],
            ['Жёсткость', product.firmness_side1 != null ? (product.firmness_side1 + '/10 · ' + product.firmness_side2 + '/10 → ' + product.firmness) : product.firmness],
            ['Высота', product.height_cm + ' см → ' + product.height_range],
            ['Нагрузка', product.max_load_kg + ' кг → ' + product.load_range],
            ['Тип', product.mattress_type],
            ['Наполнители (slug)', (product.filling_slugs || []).join(', ') || '—'],
            ['Особенности', (product.features || []).join(', ') || '—'],
            ['Размеры', (product.sizes || []).join(', ')],
          ]) + '</div>' +
          '<div><p class="section-title">Чехол</p><div>' + escapeHtml(product.cover || '—') + '</div></div>' +
          '<div><p class="section-title">Наполнение — полный список (модалка)</p><ol class="layers">' + layers + '</ol></div>' +
          '<div class="modal-box"><p class="section-title">Как в модалке каталога (slug-лейблы)</p>' + renderTable(product.modal_preview) + '</div>' +
          (notes ? '<div><p class="section-title">Примечания маппинга</p><ul class="notes">' + notes + '</ul></div>' : '') +
        '</div>' +
      '</article>';
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const filtered = PRODUCTS.filter((product) => {
        if (activeCollection !== 'all' && product.collection !== activeCollection) return false;
        if (!query) return true;
        const hay = [product.name, product.slug, product.collection, ...(product.tags || [])].join(' ').toLowerCase();
        return hay.includes(query);
      });

      grid.innerHTML = filtered.map(renderCard).join('');
      empty.hidden = filtered.length > 0;
    }

    function renderChips() {
      chipsRoot.innerHTML = COLLECTIONS.map((collection) => {
        const label = collection === 'all' ? 'Все' : collection;
        const active = collection === activeCollection ? ' is-active' : '';
        return '<button type="button" class="chip' + active + '" data-collection="' + collection + '">' + label + '</button>';
      }).join('');
    }

    chipsRoot.addEventListener('click', (event) => {
      const button = event.target.closest('[data-collection]');
      if (!button) return;
      activeCollection = button.dataset.collection;
      renderChips();
      render();
    });

    search.addEventListener('input', render);
    renderChips();
    render();
  </script>
